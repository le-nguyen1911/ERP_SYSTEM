spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://prod-postgres:5432/erp_system_prod}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false