spring:
  application:
    name: ERP_SYSTEM

  
  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        default_batch_fetch_size: 100

  flyway:
    enabled: true

jwt:
  access-token-expiration: 900000
  refresh-token-expiration: 604800000
  refresh-token-rotation: true
